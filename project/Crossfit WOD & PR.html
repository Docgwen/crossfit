<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CrossFit WOD & PR — Wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f0ede8; font-family: 'Caveat', cursive; }
  .canvas-label {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #f0ede8; padding: 6px 18px; border-radius: 20px;

<body>
<div class="canvas-label">CrossFit WOD & PR — Exploration wireframes — Samsung Flip 7</div>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">

/* ─────────────────────────────────────────
   SHARED PRIMITIVES
───────────────────────────────────────── */

const Sketch = ({ width = 390, height = 844, children, style = {} }) => (
  <div style={{
    width, height,
    background: '#faf9f6',
    border: '2.5px solid #1a1a1a',
    borderRadius: 36,
    overflow: 'hidden',
    position: 'relative',
    boxShadow: '4px 6px 0 #1a1a1a',
    fontFamily: "'Caveat', cursive",
    ...style
  }}>
    {/* status bar */}
    <div style={{ height: 36, background: 'inherit', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 24px', borderBottom: '1.5px dashed #ccc' }}>
      <span style={{ fontSize: 11, fontFamily: 'Space Mono', opacity: .5 }}>9:41</span>
      <div style={{ width: 80, height: 10, background: '#1a1a1a', borderRadius: 10, opacity: .15 }}></div>
      <span style={{ fontSize: 11, fontFamily: 'Space Mono', opacity: .5 }}>●●●</span>
    </div>
    {children}
  </div>
);

const TabBar = ({ tabs, active = 0, theme = 'light' }) => {
  const bg = theme === 'dark' ? '#111' : '#faf9f6';
  const border = theme === 'dark' ? '#333' : '#ddd';
  const fg = theme === 'dark' ? '#fff' : '#1a1a1a';
  const accent = theme === 'dark' ? '#e8ff47' : '#1a1a1a';
  return (
    <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: 72, background: bg, borderTop: `1.5px solid ${border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-around', padding: '0 8px' }}>
      {tabs.map((t, i) => (
        <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, opacity: i === active ? 1 : .35 }}>
          <div style={{ width: 22, height: 22, borderRadius: 4, border: `2px solid ${i === active ? accent : fg}`, background: i === active ? accent : 'transparent' }}></div>
          <span style={{ fontSize: 12, color: fg, fontFamily: 'Space Mono', fontSize: 9 }}>{t}</span>
        </div>
      ))}
    </div>
  );
};

const SectionHeader = ({ label, dark }) => (
  <div style={{ padding: '14px 20px 6px', borderBottom: `1.5px solid ${dark ? '#333' : '#e8e4de'}` }}>
    <span style={{ fontSize: 22, fontWeight: 700, color: dark ? '#fff' : '#1a1a1a' }}>{label}</span>
  </div>
);

const SketchInput = ({ label, value, dark, wide }) => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 3, flex: wide ? 1 : 'unset' }}>
    <span style={{ fontSize: 13, opacity: .6, color: dark ? '#aaa' : '#666', fontFamily: 'Space Mono', fontSize: 9 }}>{label}</span>
    <div style={{ height: 36, border: `1.5px solid ${dark ? '#444' : '#bbb'}`, borderRadius: 8, background: dark ? '#1e1e1e' : '#f0ede8', display: 'flex', alignItems: 'center', padding: '0 10px', fontSize: 15, color: dark ? '#ddd' : '#333' }}>
      {value || ''}
    </div>
  </div>
);

const SketchBtn = ({ label, primary, dark, small }) => (
  <div style={{
    height: small ? 32 : 44, borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center',
    fontSize: small ? 13 : 17, fontWeight: 700, cursor: 'pointer',
    background: primary ? (dark ? '#e8ff47' : '#1a1a1a') : 'transparent',
    color: primary ? (dark ? '#111' : '#fff') : (dark ? '#e8ff47' : '#1a1a1a'),
    border: primary ? 'none' : `1.5px solid ${dark ? '#e8ff47' : '#1a1a1a'}`,
    padding: '0 18px'
  }}>{label}</div>
);

const Pill = ({ label, active, color = '#e8ff47' }) => (
  <div style={{ padding: '4px 12px', borderRadius: 20, border: '1.5px solid #1a1a1a', background: active ? '#1a1a1a' : 'transparent', color: active ? '#fff' : '#1a1a1a', fontSize: 13, whiteSpace: 'nowrap' }}>{label}</div>
);

const PillDark = ({ label, active }) => (
  <div style={{ padding: '4px 12px', borderRadius: 20, border: `1.5px solid ${active ? '#e8ff47' : '#444'}`, background: active ? '#e8ff47' : 'transparent', color: active ? '#111' : '#aaa', fontSize: 13, whiteSpace: 'nowrap' }}>{label}</div>
);

const BarChart = ({ data, dark }) => {
  const max = Math.max(...data.map(d => d.v));
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, height: 64 }}>
      {data.map((d, i) => (
        <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, flex: 1 }}>
          <div style={{ width: '100%', background: dark ? '#e8ff47' : '#1a1a1a', borderRadius: '3px 3px 0 0', height: `${(d.v / max) * 52}px`, opacity: i === data.length - 1 ? 1 : .3 }}></div>
          <span style={{ fontSize: 9, fontFamily: 'Space Mono', color: dark ? '#aaa' : '#888' }}>{d.l}</span>
        </div>
      ))}
    </div>
  );
};

const HatchBg = ({ color = '#ddd' }) => (
  <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: .4 }} xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="8" stroke={color} strokeWidth="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#hatch)"/>
  </svg>
);

/* ─────────────────────────────────────────
   DIRECTION A — Dark Intensity
   Thème sombre, accent jaune fluo, vibes box
───────────────────────────────────────── */

const A_LogWOD = () => (

          </div>
        </div>

        {/* Box info */}

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontSize: 16, color: '#fff', fontWeight: 700 }}>📍 Box</span>
            <div style={{ display: 'flex', gap: 6 }}>
              <div style={{ padding: '2px 10px', borderRadius: 20, background: '#e8ff47', color: '#111', fontSize: 12, fontWeight: 700 }}>Ma box</div>
              <div style={{ padding: '2px 10px', borderRadius: 20, border: '1px solid #444', color: '#888', fontSize: 12 }}>Drop-in</div>

        {/* Mouvements */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>

          ].map((m, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#1a1a1a', borderRadius: 8, padding: '8px 12px', border: '1px solid #2a2a2a' }}>

              <span style={{ flex: 1, color: '#fff', fontSize: 16 }}>{m.mv}</span>
              <span style={{ color: '#888', fontSize: 14 }}>{m.val}</span>
            </div>
          ))}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, border: '1.5px dashed #333', borderRadius: 8, padding: '8px 12px' }}>
            <span style={{ color: '#555', fontSize: 15 }}>+ Ajouter un mouvement…</span>
          </div>
        </div>

        {/* Résultat */}
        <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end' }}>
          <SketchInput label="RÉSULTAT" value="3:47" dark wide />
          <SketchInput label="SCALE" value="Rx" dark />
          <SketchBtn label="💾 Sauver" primary dark />
        </div>

      </div>
      <TabBar tabs={['WOD','PR','STATS','HISTO']} active={0} theme="dark" />
    </div>
  </Sketch>
);

const A_History = () => (
  <Sketch style={{ background: '#111' }}>
    <div style={{ height: '100%', background: '#111', display: 'flex', flexDirection: 'column' }}>
      <SectionHeader label="Historique" dark />
      {/* filtre mois */}
      <div style={{ display: 'flex', gap: 8, padding: '10px 18px', overflowX: 'auto' }}>

        {[
          { date: 'Mer 30 Avr', type: 'FOR TIME', name: 'Fran', result: '3:47 Rx', box: 'CrossFit SUD', coach: 'Romain', drop: false },

        ].map((w, i) => (
          <div key={i} style={{ background: '#1a1a1a', borderRadius: 12, padding: '12px 14px', border: '1px solid #2a2a2a', display: 'flex', flexDirection: 'column', gap: 6 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>

              <span style={{ fontSize: 18, color: '#e8ff47', fontWeight: 700 }}>{w.result}</span>
            </div>
            <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
              <span style={{ fontSize: 12, color: '#666' }}>📍 {w.box} · 👤 {w.coach}</span>
            </div>
          </div>
        ))}
        <div style={{ height: 80 }}></div>
      </div>
      <TabBar tabs={['WOD','PR','STATS','HISTO']} active={3} theme="dark" />
    </div>
  </Sketch>
);

const A_PR = () => (
  <Sketch style={{ background: '#111' }}>
    <div style={{ height: '100%', background: '#111', display: 'flex', flexDirection: 'column' }}>

          { name: 'Deadlift', pr: '180 kg', date: 'Mar 26', trend: '–' },
        ].map((p, i) => (
          <div key={i} style={{ background: '#1a1a1a', borderRadius: 12, padding: '12px 14px', border: '1px solid #2a2a2a', display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ width: 4, height: 40, background: '#e8ff47', borderRadius: 2 }}></div>
            <div style={{ flex: 1 }}>

            <div style={{ textAlign: 'right' }}>
              <div style={{ fontSize: 22, fontWeight: 700, color: '#e8ff47' }}>{p.pr}</div>
              <div style={{ fontSize: 12, color: p.trend !== '–' ? '#4caf50' : '#555' }}>{p.trend}</div>
            </div>
          </div>
        ))}
        {/* mini chart */}
        <div style={{ background: '#1a1a1a', borderRadius: 12, padding: '12px 14px', border: '1px solid #2a2a2a' }}>
          <div style={{ fontSize: 13, color: '#888', fontFamily: 'Space Mono', marginBottom: 8 }}>CLEAN & JERK — évolution</div>
          <BarChart data={[{l:'S',v:90},{l:'O',v:95},{l:'N',v:95},{l:'D',v:100},{l:'J',v:100},{l:'F',v:105},{l:'A',v:105}]} dark />

      </div>
