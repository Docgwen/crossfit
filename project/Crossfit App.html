function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const set = React.useCallback((keyOrObj, val) => {
    const edits = typeof keyOrObj === 'object' ? keyOrObj : { [keyOrObj]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, set];
}

function TweaksPanel({ children }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const handler = (e) => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  if (!open) return null;
  return (
    <div ref={ref} className="twk-panel">
      <div className="twk-hd"><b>Tweaks</b><button className="twk-x" onClick={dismiss}>✕</button></div>
      <div className="twk-body">{children}</div>
    </div>
  );
}
function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <span className="twk-lbl">{label}</span>
      <input type="color" className="twk-swatch" value={value} onChange={e => onChange(e.target.value)} />
    </div>
  );
}
function TweakSlider({ label, value, min, max, step = 1, unit = '', onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-row twk-row-h"><span className="twk-lbl">{label}</span><span style={{fontSize:11,color:'rgba(224,221,240,.4)',fontFamily:'DM Mono'}}>{value}{unit}</span></div>
      <input type="range" className="twk-slider" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} />
    </div>
  );
}

function MiniBar({ data, T, barColor, height=64 }) {
  const max = Math.max(...data.map(d => d.v), 1);
  const bc = barColor || T.accentColor;
  return (
    <div style={{ display:'flex', alignItems:'flex-end', gap:5, height }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
          <div style={{ width:'100%', borderRadius:'3px 3px 0 0', background: i===data.length-1 ? bc : T.bg3, height:`${Math.max(4,(d.v/max)*(height-18))}px`, transition:'height .3s' }}></div>
          <span style={{ fontSize:9, fontFamily:'DM Mono', color:T.textMuted }}>{d.l}</span>
        </div>
      ))}
    </div>
  );
}

      </div>
      {/* Légende */}

};
const PR_UNITS = {
  halte: 'kg', gymn: 'reps', cardio: 'temps', bench: 'temps',
};
const RM_OPTIONS = ['1RM','2RM','3RM','5RM','Max reps','Temps','Distance'];

function NewPRScreen({ T, onSaved, onBack }) {

  const [prevPR, setPrevPR] = React.useState('100');

        {/* Valeur + unité */}
        <Card T={T} style={{ display:'flex', flexDirection:'column', gap:12 }}>

          <div style={{ display:'flex', gap:10 }}>

          {/* Badge PR */}

                <div style={{ fontSize:12, color:T.textMuted }}>Record personnel battu</div>
              </div>
            </div>
          )}
        </Card>

        {/* Date */}
        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
          <Lbl T={T}>DATE</Lbl>
          <input value={date} onChange={e => setDate(e.target.value)} style={inputStyle}/>
        </div>

        {/* Notes */}
        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
          <Lbl T={T}>NOTES</Lbl>
          <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Conditions, sensations…" style={{ ...inputStyle, height:56, resize:'none', lineHeight:1.5 }}></textarea>
        </div>

        {/* Save */}
        <button onClick={handleSave} style={{ width:'100%', height:52, borderRadius:T.cardRadius, background: saved ? '#5abf7a' : T.accentColor, color:T.bg0, fontSize:17, fontWeight:700, fontFamily:'DM Sans', border:'none', cursor:'pointer', transition:'background .25s' }}>
          {saved ? '🏆 PR enregistré !' : 'Enregistrer le PR'}
        </button>
      </div>
    </div>
  );
}

// Jours du mois d'avril 2026 (mercredi = 1er)
const APRIL_SESSIONS = { 2:true, 5:true, 7:true, 9:true, 12:true, 14:true, 16:true, 19:true, 21:true, 23:true, 26:true, 28:true, 30:true };
const CAL_DAYS = ['L','M','M','J','V','S','D'];

function MiniCalendar({ T, onSelectDay, selectedDay }) {
  // Avril 2026 : 1er = mercredi (index 2)
  const firstDow = 2; // 0=Lun
  const daysInMonth = 30;
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  return (
    <div style={{ background:T.bg2, borderRadius:T.cardRadius, padding:'12px 14px' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
        <span style={{ fontSize:14, fontWeight:600, color:T.textPrimary }}>Avril 2026</span>
        <div style={{ display:'flex', gap:6 }}>
          <button style={{ background:'none', border:'none', color:T.textMuted, fontSize:16, cursor:'pointer', padding:'0 4px' }}>‹</button>
          <button style={{ background:'none', border:'none', color:T.textMuted, fontSize:16, cursor:'pointer', padding:'0 4px' }}>›</button>
        </div>
      </div>
      {/* En-têtes jours */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom:4 }}>
        {CAL_DAYS.map((d,i) => (
          <div key={i} style={{ textAlign:'center', fontSize:9, fontFamily:'DM Mono', color:T.textMuted, padding:'2px 0' }}>{d}</div>
        ))}
      </div>
      {/* Cellules */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:3 }}>
        {cells.map((d, i) => {
          if (!d) return <div key={i}></div>;
          const hasSession = !!APRIL_SESSIONS[d];
          const isSelected = selectedDay === d;
          return (
            <button key={i} onClick={() => onSelectDay(hasSession ? d : null)} style={{
              width:'100%', aspectRatio:'1', borderRadius:6, border:'none', cursor: hasSession ? 'pointer' : 'default',
              background: isSelected ? T.accentColor : hasSession ? T.bg3 : 'transparent',
              color: isSelected ? T.bg0 : hasSession ? T.textPrimary : T.textMuted,
              fontSize:11, fontWeight: hasSession ? 600 : 400, fontFamily:'DM Mono',
              position:'relative', display:'flex', alignItems:'center', justifyContent:'center',
              transition:'background .15s'
            }}>
              {d}
              {hasSession && !isSelected && (
                <div style={{ position:'absolute', bottom:2, left:'50%', transform:'translateX(-50%)', width:4, height:4, borderRadius:'50%', background:T.accentColor }}></div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

            <div style={{ background:T.bg2, borderRadius:12, padding:'10px 12px' }}>
              <Lbl T={T} style={{ display:'block', marginBottom:3 }}>CALORIES AVR.</Lbl>
              <div style={{ fontSize:22, fontWeight:700, color:T.textPrimary }}>6.1<span style={{ fontSize:12, color:T.textMuted }}>k</span></div>
              <div style={{ fontSize:10, color:T.textMuted }}>kcal</div>
            </div>
            <div style={{ background:T.bg2, borderRadius:12, padding:'10px 12px' }}>
              <Lbl T={T} style={{ display:'block', marginBottom:3 }}>ZONE 2 MOY.</Lbl>
              <div style={{ fontSize:22, fontWeight:700, color:'#4abf7a' }}>29<span style={{ fontSize:12, color:T.textMuted }}>%</span></div>
              <div style={{ fontSize:10, color:T.textMuted }}>aérobie</div>
            </div>
          </div>

          {/* Zone bar du mois */}
          <div style={{ background:T.bg2, borderRadius:12, padding:'10px 12px' }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
              <Lbl T={T}>ZONES AVR.</Lbl>
              <span style={{ fontSize:10, fontFamily:'DM Mono', color:'#4abf7a' }}>Z2+Z3 62%</span>
            </div>
            <div style={{ height:8, borderRadius:4, overflow:'hidden', display:'flex', gap:1 }}>
              <div style={{ width:'6%',  background:ZONE_COLORS[0] }}></div>
              <div style={{ width:'29%', background:ZONE_COLORS[1] }}></div>
              <div style={{ width:'33%', background:ZONE_COLORS[2] }}></div>
              <div style={{ width:'27%', background:ZONE_COLORS[3] }}></div>
              <div style={{ width:'13%', background:ZONE_COLORS[4] }}></div>
            </div>
            <div style={{ display:'flex', gap:8, marginTop:6 }}>
              {['Z1','Z2','Z3','Z4','Z5'].map((z,i) => (
                <div key={z} style={{ display:'flex', alignItems:'center', gap:2 }}>
                  <div style={{ width:6, height:6, borderRadius:'50%', background:ZONE_COLORS[i] }}></div>
                  <span style={{ fontSize:9, fontFamily:'DM Mono', color:T.textMuted }}>{z}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Prochain WOD hint */}
          <div style={{ display:'flex', alignItems:'center', gap:10, background:`rgba(184,255,87,.07)`, border:`1px solid rgba(184,255,87,.15)`, borderRadius:12, padding:'10px 14px' }}>
            <span style={{ fontSize:20 }}>⚡</span>
            <div>
              <div style={{ fontSize:12, fontWeight:600, color:T.accentColor }}>Prochain WOD</div>
              <div style={{ fontSize:11, color:T.textMuted }}>Lundi 5 Mai — CrossFit SUD</div>
            </div>
          </div>
        </div>

        {/* Bord bas */}
        <div style={{ height:8, background:'#111' }}></div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// ROOT
// ─────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const T = tweaks;
  const [tab, setTab] = React.useState('wod');
  const [showNewPR, setShowNewPR] = React.useState(false);
  const [flipMode, setFlipMode] = React.useState(false);

  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:'100vh', background:'#13131d', gap:16, padding:'24px 0' }}>
      {/* Toggle Flip / App */}
      <div style={{ display:'flex', background:'rgba(255,255,255,.06)', borderRadius:12, padding:3, gap:2 }}>
        <button onClick={() => setFlipMode(false)} style={{ padding:'6px 18px', borderRadius:9, border:'none', background: !flipMode ? 'rgba(255,255,255,.12)' : 'transparent', color: !flipMode ? '#e4e2f0' : '#58566e', fontSize:12, fontFamily:'DM Mono', cursor:'pointer', letterSpacing:'.04em' }}>📱 App</button>
        <button onClick={() => setFlipMode(true)}  style={{ padding:'6px 18px', borderRadius:9, border:'none', background: flipMode  ? 'rgba(255,255,255,.12)' : 'transparent', color: flipMode  ? '#e4e2f0' : '#58566e', fontSize:12, fontFamily:'DM Mono', cursor:'pointer', letterSpacing:'.04em' }}>🔒 Couverture Flip</button>
      </div>

      {!flipMode && (
        <div style={{ width:390, height:844, background:T.bg0, borderRadius:44, overflow:'hidden', display:'flex', flexDirection:'column', boxShadow:'0 0 0 1px #2e2e3e, 0 32px 80px rgba(0,0,0,.6)' }}>
          <StatusBar T={T} />
          {tab === 'wod'   && <WodScreen T={T} onSaved={() => setTab('histo')} />}
          {tab === 'histo' && <HistoScreen T={T} onNewWod={() => setTab('wod')} />}
          {tab === 'pr'    && !showNewPR && <PRScreen T={T} onNewPR={() => setShowNewPR(true)} />}
          {tab === 'pr'    && showNewPR  && <NewPRScreen T={T} onBack={() => setShowNewPR(false)} onSaved={() => setShowNewPR(false)} />}
          {tab === 'stats' && <StatsScreen T={T} />}
          <TabBar active={tab} onTab={(t) => { setTab(t); setShowNewPR(false); }} T={T} />
        </div>
      )}

      {flipMode && (
        <div style={{ background:'#13131d', borderRadius:16, padding:'0', overflow:'hidden' }}>
          <FlipCoverScreen T={T} />
        </div>
      )}

      <TweaksPanel>
        <TweakSection label="Couleurs principales" />
        <TweakColor label="Accent" value={T.accentColor} onChange={v => setTweak('accentColor', v)} />
        <TweakColor label="Drop-in" value={T.dropColor} onChange={v => setTweak('dropColor', v)} />
        <TweakSection label="Fonds" />
        <TweakColor label="Fond principal" value={T.bg0} onChange={v => setTweak('bg0', v)} />
        <TweakColor label="Cards" value={T.bg2} onChange={v => setTweak('bg2', v)} />
        <TweakColor label="Éléments" value={T.bg3} onChange={v => setTweak('bg3', v)} />
        <TweakSection label="Mise en page" />
        <TweakSlider label="Radius cards" value={T.cardRadius} min={4} max={24} step={1} unit="px" onChange={v => setTweak('cardRadius', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
